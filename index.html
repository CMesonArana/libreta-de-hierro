<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreta de Hierro</title>
<meta name="theme-color" content="#14171b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="app.css?v=3">
<script>
  // old links (?solo=estetica / ?solo=perdida) go to the person's own page
  const viejo = { estetica: "carlos/", perdida: "kevin/" }[new URLSearchParams(location.search).get("solo")];
  if (viejo) location.replace(viejo);
</script>
<style>
.pick { max-width: 560px; margin: 0 auto; padding-block: 40px; display: grid; gap: 16px; }
.pick h1 { font-size: 40px; font-weight: 900; text-transform: uppercase; }
.pick h1 span { color: var(--accent); }
.who { display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: inherit; text-decoration: none; }
.who:hover { border-color: var(--accent); }
.who .disc { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 28px; color: #fff; }
.who b { font-family: var(--display); font-size: 28px; font-weight: 800; text-transform: uppercase; display: block; line-height: 1; }
.who small { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main class="wrap pick">
  <h1>Libreta de <span>Hierro</span></h1>
  <p class="label" style="margin:0">¿Quién entrena?</p>
  <a class="who" href="carlos/"><span class="disc" style="background:#d93a26">C</span><span><b>Carlos</b><small>Estética: pecho, glúteo, hombros y abdomen</small></span></a>
  <a class="who" href="kevin/"><span class="disc" style="background:#0f7f6a">K</span><span><b>Kevin</b><small>Pérdida de grasa sin perder músculo</small></span></a>
  <p class="foot">Exercise data by <a href="https://repdb.co" target="_blank" rel="noopener">RepDB (repdb.co)</a></p>
</main>
</body>
</html>
